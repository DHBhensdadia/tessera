name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant. Cancelling it keeps feedback
# fast and avoids queueing runs nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic installs. --locked below fails the build if uv.lock is stale rather
  # than silently resolving something different from what was committed.
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-groups

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: architectural boundaries
        run: uv run lint-imports

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The engine ships to Linux as a Docker image and to macOS inside the .app, so
      # both are production platforms and both are tested.
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-groups

      - name: pytest
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: coverage summary
        if: always()
        run: |
          echo "### Coverage (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "_no coverage data_" >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
