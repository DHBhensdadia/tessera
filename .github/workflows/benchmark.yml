# The ITC-2007 benchmark, on instances this repository does not contain.
#
# The 21 `.ctt` files are somebody else's data with no declared licence, so they are fetched
# and verified rather than redistributed (4.5's D10). `scripts/itc2007.py` does that, and the
# checksums it verifies against have been committed since 4.2 — which is what makes fetching
# as trustworthy as committing.
#
# **It never gates a push.** The per-push suite in `ci.yml` exercises the whole CB-CTT path on
# `toy.ctt`, which *is* committed, at full branch coverage. What this adds is scale, and scale
# takes an hour. Somebody else's web server deciding how a push goes would be the tail wagging
# the dog.
name: Benchmark

on:
  workflow_dispatch:
  schedule:
    # Mondays, early. Nothing waits on it.
    - cron: "0 3 * * 1"

jobs:
  itc2007:
    name: ITC-2007
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version-file: .python-version

      - run: uv sync --locked --all-groups

      # Keyed on the checksums, so a re-issued instance misses the cache and is fetched and
      # re-verified rather than served stale from it.
      - uses: actions/cache@v4
        with:
          path: .itc2007
          key: itc2007-${{ hashFiles('scripts/itc2007-instances.sha256') }}

      # Two failures, reported as the different facts they are. A host that cannot be reached
      # says nothing about this repository, so the run is skipped and says so; a file that
      # hashes wrong says a great deal, so the job fails.
      - id: instances
        name: the instances, fetched and verified
        run: |
          set +e
          uv run python scripts/itc2007.py "$GITHUB_WORKSPACE/.itc2007"
          code=$?
          set -e
          case "$code" in
            0)  echo "have=true" >> "$GITHUB_OUTPUT" ;;
            75) echo "have=false" >> "$GITHUB_OUTPUT"
                echo "::notice::the instance host is unreachable, so nothing was measured" ;;
            *)  exit "$code" ;;
          esac

      - name: pytest -m benchmark
        if: steps.instances.outputs.have == 'true'
        env:
          TESSERA_ITC2007_INSTANCES: ${{ github.workspace }}/.itc2007
        run: uv run pytest -m benchmark -q

      # The sweep itself, and deliberately **without** `--baseline`.
      #
      # The committed baseline was measured at a three-hundred-second *wall clock*, which is
      # the competition's protocol and the only budget a published comparison can honestly
      # use — and a wall clock is not reproducible on other hardware. Comparing an
      # `ubuntu-latest` runner against numbers taken on an arm64 laptop would fire D7's
      # quality verdict on almost every row, which is a gate that cries wolf (#258) with the
      # wolf built in at the design stage.
      #
      # So this is a **report**: the table goes into the job summary and the results are kept
      # as an artefact. What actually guards against regression runs on every push and needs
      # no download — `tests/solver/test_determinism.py` pins a penalty, a timetable and a work
      # figure that CI's two architectures both reproduce, and `tests/bench/` exercises the
      # harness itself. `--baseline` stays for a human re-running the sweep on the machine the
      # baseline came from.
      - name: the sweep
        if: steps.instances.outputs.have == 'true'
        id: sweep
        run: |
          uv run tessera bench --suite itc2007 \
            --instances "$GITHUB_WORKSPACE/.itc2007" \
            --write results.json | tee sweep.txt

      # `always()` so the table is published whether or not a verdict fired: a run that found
      # a regression is the one whose numbers somebody most wants to read.
      - name: the table
        if: always() && steps.instances.outputs.have == 'true'
        run: |
          {
            echo "### ITC-2007"
            echo
            sed -n '/^| instance/,$p' sweep.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: keep the results
        if: always() && steps.instances.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: itc2007-results
          path: |
            results.json
            sweep.txt
          retention-days: 90

      - name: say why nothing ran
        if: steps.instances.outputs.have != 'true'
        run: |
          echo "### ITC-2007 benchmark skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The instance host was unreachable. Nothing is claimed about the solver." \
            >> "$GITHUB_STEP_SUMMARY"
