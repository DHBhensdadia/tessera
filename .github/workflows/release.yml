name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: build and verify the disk image
    # Apple Silicon only (ADR-0011): PyInstaller cannot cross-compile, so the runner
    # architecture is the artefact's architecture. macos-15 rather than macos-14
    # because the client is Swift 6 and macos-14 ships Swift 5.10.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than left to the runner default, so a change to the image cannot
      # silently move the language version the client is built against.
      - name: select xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: report toolchain
        run: swift --version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-groups

      - name: build
        run: ./packaging/build.sh

      # The unit suite spawns the engine from Python and passes whether or not a shipped
      # bundle leaks a process. This is the only place that failure is observable, so a
      # release that skipped it would be a release nobody had actually run.
      - name: smoke test the disk image
        run: ./packaging/smoke-test.sh

      - name: checksum
        run: shasum -a 256 packaging/out/*.dmg | tee packaging/out/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: |
            packaging/out/*.dmg
            packaging/out/SHA256SUMS

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packaging/out/*.dmg packaging/out/SHA256SUMS \
            --title "Tessera ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "
          Apple Silicon only. Requires macOS 14 or later.

          This build is signed but **not notarized**, so macOS will refuse it on first
          launch. Right-click the app and choose Open, or run:

              xattr -dr com.apple.quarantine /Applications/Tessera.app
          "
