name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: build and verify the disk image
    # Apple Silicon only (ADR-0011): PyInstaller cannot cross-compile, so the runner
    # architecture is the artefact's architecture.
    #
    # macos-26 because the SDK decides what the app looks like. An app built against the
    # macOS 26 SDK adopts Liquid Glass; the same source built against an older one keeps
    # the previous appearance — so while this pinned Xcode 16.4 on macos-15, the .dmg
    # users downloaded did not look like the app built on the machine it was designed on.
    # The deployment target is unchanged at macOS 14 (Package.swift); SDK and deployment
    # target are independent axes.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than left to the runner default, so a change to the image cannot
      # silently move the SDK the client is built against — which is now a question about
      # how the application looks, not only about which language features compile.
      # 26.6 (build 17F113) is the image default and matches the development machine.
      - name: select xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || sudo xcode-select -s /Applications/Xcode.app

      # Recorded in the log rather than assumed, because "which SDK produced this
      # artefact" is the question that started Phase 3.1.
      - name: report toolchain
        run: |
          swift --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --all-groups

      - name: build
        run: ./packaging/build.sh

      # The unit suite spawns the engine from Python and passes whether or not a shipped
      # bundle leaks a process. This is the only place that failure is observable, so a
      # release that skipped it would be a release nobody had actually run.
      - name: smoke test the disk image
        run: ./packaging/smoke-test.sh

      # Filenames only, no build path: the published file has to be usable where a
      # user downloads it, and `shasum -c` resolves paths relative to the cwd.
      - name: checksum
        working-directory: packaging/out
        run: shasum -a 256 *.dmg | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dmg
          path: |
            packaging/out/*.dmg
            packaging/out/SHA256SUMS

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            packaging/out/*.dmg packaging/out/SHA256SUMS \
            --title "Tessera ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "
          Apple Silicon only. Requires macOS 14 or later.

          This build is signed but **not notarized**, so macOS will refuse it on first
          launch. Right-click the app and choose Open, or run:

              xattr -dr com.apple.quarantine /Applications/Tessera.app
          "
