{% extends "base.html" %}
{% block body %}
<h1>Console</h1>
<p class="lede">A plain interface to the engine, for entering and checking data by hand.</p>
<table>
  <tr><th>Section</th><th>What it holds</th></tr>
  {% for section in sections %}
  <tr><td><a href="{{ section.href }}">{{ section.label }}</a></td><td>{{ section.blurb }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
