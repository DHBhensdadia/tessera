[project]
name = "tessera-timetable"
version = "0.1.0"
description = "University timetable scheduling with constraint optimisation"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Devansh" }]
keywords = ["timetabling", "scheduling", "constraint-programming", "university", "cp-sat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
tessera = "tessera.cli:main"
tessera-openapi = "tessera.cli.openapi:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "hypothesis>=6.165.3",
    "httpx>=0.28.1",
    "pyinstaller>=6.22.0",
    "pandas-stubs>=3.0.5.260730",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tessera"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tessera", "tests"]
# Alembic writes these itself and its formatting is not ours to argue with. env.py is
# hand-written and stays linted.
extend-exclude = ["tessera/repository/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowing builtins
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return consistency
    "PTH",       # prefer pathlib
    "RUF",       # ruff-specific
    "ANN",       # missing annotations
    "TID",       # tidy imports
]
ignore = [
    "ANN401",    # allow Any where it is genuinely the right type
    "B008",      # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]   # test signatures carry no useful type information

[tool.ruff.lint.flake8-builtins]
# `credits` is what a university calls the weight of a course, and it is already the
# name of the column, the domain field and the wire field. Renaming only the function
# argument to dodge a shadow would break that consistency for no gain: the builtin it
# hides is the interactive banner helper, not something any of this code could want.
# Listed explicitly rather than suppressed inline — there is no `noqa` in this codebase
# and this is the reason to keep it that way.
builtins-ignorelist = ["credits"]

[tool.ruff.lint.pep8-naming]
# `declared_attr` really is handed the class, so `cls` is the honest name for it. The
# alternative to telling ruff that is renaming the argument to `self` — writing something
# false to satisfy a linter — or the codebase's first `noqa`. Both are worse.
classmethod-decorators = ["sqlalchemy.orm.declared_attr", "declared_attr"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# Without this our own package sorts in with third-party dependencies, which makes it
# harder to see at a glance what a module actually depends on.
known-first-party = ["tessera"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
exclude = ["tessera/repository/migrations/versions/"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
show_error_codes = true
files = ["tessera", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: takes more than a second; excluded from the fast feedback loop",
    "benchmark: runs against ITC instances",
]

[tool.coverage.run]
source = ["tessera"]
branch = true
omit = [
    # Exercised end to end by tests/test_engine.py, which spawns it as a subprocess.
    # Coverage cannot follow across that boundary, so leaving it in reported 0% for
    # code that has eight tests — a number that misleads is worse than none.
    "tessera/engine.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# import-linter — the architectural boundaries from P2 §3, enforced as a build
# failure rather than a convention. These contracts are the reason the domain
# layer stays portable; without them it erodes one convenient import at a time.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "tessera"
# Required because the forbidden-module contracts below name third-party packages
# (fastapi, sqlalchemy, ortools) rather than only internal ones.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: nothing beneath may reach upward"
type = "layers"
layers = ["tessera.api", "tessera.repository", "tessera.domain"]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["tessera.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic", "ortools", "reportlab", "jinja2"]

[[tool.importlinter.contracts]]
name = "Solver knows nothing of transport or storage"
type = "forbidden"
source_modules = ["tessera.solver"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "alembic"]

[[tool.importlinter.contracts]]
name = "Repository knows nothing of transport or solving"
type = "forbidden"
source_modules = ["tessera.repository"]
forbidden_modules = ["fastapi", "starlette", "ortools"]

[[tool.importlinter.contracts]]
name = "Exporters and importers are standalone"
type = "forbidden"
source_modules = ["tessera.export", "tessera.importers"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "ortools"]
